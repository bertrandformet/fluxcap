name: Planification veille et notifications

# Déclenche la collecte de veille (RSS/Atom) et les notifications email d'ouverture/
# clôture Pro/Perso, aux heures définies dans la spec (voir "Planning des
# notifications"). Les horaires ci-dessous sont en UTC, calés sur l'heure d'hiver
# (CET, UTC+1) : ils dérivent d'environ 1h pendant l'heure d'été (CEST), GitHub
# Actions ne gérant pas les fuseaux horaires nativement.
#
# Perso a deux rythmes (semaine 21h/7h, week-end 9h/21h) — les quatre créneaux sont
# désormais déclenchés tous les jours ; c'est le backend qui décide, selon le vrai jour
# de la semaine et le mode congés, lequel des deux rythmes s'applique aujourd'hui (voir
# app/services/notification_email.py::_bon_creneau — no-op silencieux sinon). Ça permet
# à Perso de basculer sur le rythme week-end pendant la semaine quand les congés sont
# actifs, sans dépendre d'un cron figé sur lun-ven/sam-dim.
#
# Pro clôture le vendredi à 13h au lieu de 17h30 (remplace, pas en plus) — contrairement
# à Perso, Pro n'a pas de logique de créneau côté backend : notifier_cloture() envoie
# simplement le récap de ce qui est en attente, quelle que soit l'heure d'appel. Il
# suffit donc de découper le cron lun-jeu/vendredi, sans changement de code backend.
#
# Secrets de repo requis (Settings → Secrets and variables → Actions) :
#   BACKEND_URL       ex. https://taches-notes-veille-api.onrender.com
#   SCHEDULER_SECRET  même valeur que la variable d'env SCHEDULER_SECRET sur Render

on:
  schedule:
    - cron: "0 5 * * 1-5"    # veille Pro — 6h Paris, lun-ven
    - cron: "0 19 * * *"     # veille Perso — 20h Paris, tous les jours
    - cron: "30 6 * * 1-5"   # notif Pro ouverture — 7h30 Paris, lun-ven
    - cron: "30 16 * * 1-4"  # notif Pro clôture — 17h30 Paris, lun-jeu
    - cron: "0 12 * * 5"     # notif Pro clôture — 13h00 Paris, vendredi
    - cron: "0 20 * * *"     # notif Perso ouverture (rythme semaine) — 21h00 Paris, tous les jours
    - cron: "1 20 * * *"     # notif Perso clôture (rythme weekend) — 21h01 Paris, tous les jours
    - cron: "0 6 * * *"      # notif Perso clôture (rythme semaine) — 7h Paris, tous les jours
    - cron: "0 8 * * *"      # notif Perso ouverture (rythme weekend) — 9h Paris, tous les jours
  workflow_dispatch:
    inputs:
      action:
        description: "Déclenchement manuel (pour tester sans attendre l'heure)"
        type: choice
        required: true
        options:
          - veille_pro
          - veille_perso
          - notif_pro_ouverture
          - notif_pro_cloture
          - notif_pro_cloture_vendredi
          - notif_perso_ouverture_semaine
          - notif_perso_cloture_semaine
          - notif_perso_ouverture_weekend
          - notif_perso_cloture_weekend

jobs:
  declencher:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler le backend
        env:
          BASE_URL: ${{ secrets.BACKEND_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          ACTION_MANUELLE: ${{ inputs.action }}
          CRON_DECLENCHEUR: ${{ github.event.schedule }}
        run: |
          set -e
          case "${ACTION_MANUELLE:-$CRON_DECLENCHEUR}" in
            veille_pro|"0 5 * * 1-5")
              ENDPOINT="/planification/veille/pro" ;;
            veille_perso|"0 19 * * *")
              ENDPOINT="/planification/veille/perso" ;;
            notif_pro_ouverture|"30 6 * * 1-5")
              ENDPOINT="/planification/notification/pro/ouverture" ;;
            notif_pro_cloture|"30 16 * * 1-4")
              ENDPOINT="/planification/notification/pro/cloture" ;;
            notif_pro_cloture_vendredi|"0 12 * * 5")
              ENDPOINT="/planification/notification/pro/cloture" ;;
            notif_perso_ouverture_semaine|"0 20 * * *")
              ENDPOINT="/planification/notification/perso/ouverture?creneau=semaine" ;;
            notif_perso_cloture_weekend|"1 20 * * *")
              ENDPOINT="/planification/notification/perso/cloture?creneau=weekend" ;;
            notif_perso_cloture_semaine|"0 6 * * *")
              ENDPOINT="/planification/notification/perso/cloture?creneau=semaine" ;;
            notif_perso_ouverture_weekend|"0 8 * * *")
              ENDPOINT="/planification/notification/perso/ouverture?creneau=weekend" ;;
            *)
              echo "Déclencheur non reconnu : ${ACTION_MANUELLE:-$CRON_DECLENCHEUR}"
              exit 1 ;;
          esac
          echo "Appel de ${BASE_URL}${ENDPOINT}"
          curl -fsS -X POST "${BASE_URL}${ENDPOINT}" -H "X-Scheduler-Secret: ${SCHEDULER_SECRET}"
