name: Planification veille et notifications

# Déclenche la collecte de veille (RSS/Atom) et les notifications email d'ouverture/
# clôture Pro/Perso. Le planning réel est géré par 9 tâches cron-job.org (POST vers
# /planification/*, en-tête X-Scheduler-Secret, fuseau Europe/Paris) — voir la section
# "Planification" du README pour le détail des 9 horaires.
#
# Ce workflow ne fait plus que du déclenchement manuel (bouton "Run workflow"), pour
# tester un endpoint sans attendre l'heure réelle. Il portait auparavant aussi les
# `schedule:` cron, abandonnés le 2026-07-23 : GitHub Actions s'est montré peu fiable
# sur des horaires précis (retards observés de 1h à 5h40 sur les mêmes créneaux tous
# les jours, confirmés par l'historique d'envoi Resend), au-delà de la simple
# congestion occasionnelle déjà documentée pour d'autres crons courts de ce projet.
#
# Secrets de repo requis (Settings → Secrets and variables → Actions) :
#   BACKEND_URL       ex. https://taches-notes-veille-api.onrender.com
#   SCHEDULER_SECRET  même valeur que la variable d'env SCHEDULER_SECRET sur Render
#                      (même valeur aussi renseignée dans les en-têtes cron-job.org)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Déclenchement manuel (pour tester sans attendre l'heure)"
        type: choice
        required: true
        options:
          - veille_pro
          - veille_perso
          - notif_pro_ouverture
          - notif_pro_cloture
          - notif_pro_cloture_vendredi
          - notif_perso_ouverture_semaine
          - notif_perso_cloture_semaine
          - notif_perso_ouverture_weekend
          - notif_perso_cloture_weekend

jobs:
  declencher:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler le backend
        env:
          BASE_URL: ${{ secrets.BACKEND_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
          ACTION_MANUELLE: ${{ inputs.action }}
        run: |
          set -e
          case "${ACTION_MANUELLE}" in
            veille_pro)
              ENDPOINT="/planification/veille/pro" ;;
            veille_perso)
              ENDPOINT="/planification/veille/perso" ;;
            notif_pro_ouverture)
              ENDPOINT="/planification/notification/pro/ouverture" ;;
            notif_pro_cloture)
              ENDPOINT="/planification/notification/pro/cloture" ;;
            notif_pro_cloture_vendredi)
              ENDPOINT="/planification/notification/pro/cloture" ;;
            notif_perso_ouverture_semaine)
              ENDPOINT="/planification/notification/perso/ouverture?creneau=semaine" ;;
            notif_perso_cloture_weekend)
              ENDPOINT="/planification/notification/perso/cloture?creneau=weekend" ;;
            notif_perso_cloture_semaine)
              ENDPOINT="/planification/notification/perso/cloture?creneau=semaine" ;;
            notif_perso_ouverture_weekend)
              ENDPOINT="/planification/notification/perso/ouverture?creneau=weekend" ;;
            *)
              echo "Déclencheur non reconnu : ${ACTION_MANUELLE}"
              exit 1 ;;
          esac
          echo "Appel de ${BASE_URL}${ENDPOINT}"
          curl -fsS -X POST "${BASE_URL}${ENDPOINT}" -H "X-Scheduler-Secret: ${SCHEDULER_SECRET}"
