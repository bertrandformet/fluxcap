<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="display:flex;flex-direction:column;align-items:center;gap:14px;font-family:Inter,system-ui,sans-serif">
  <div style="display:flex;gap:8px;align-items:center;background:{{ toolbarBg }};padding:6px;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)">
    <button onClick="{{ toggleDesktop }}" style="{{ btnModeMobileStyle }}">Mobile</button>
    <button onClick="{{ toggleDesktop }}" style="{{ btnModeDesktopStyle }}">Desktop</button>
    <div style="width:1px;height:20px;background:#00000018;margin:0 2px"></div>
    <button onClick="{{ toggleDark }}" style="{{ btnDarkStyle }}">{{ darkLabel }}</button>
  </div>

  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ true }}">
    <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ dark }}" hint-size="402,874">
      {{ appBody }}
    </x-import>
  </sc-if>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ false }}">
    <div style="{{ desktopFrameStyle }}">
      {{ appBody }}
    </div>
  </sc-if>
</div>

</x-dc>
