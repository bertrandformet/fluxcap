services:
  - type: web
    name: taches-notes-veille-api
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      # Postgres Supabase (Project Settings → Database → Connection string, mode
      # "Transaction" ou "Session" — copier tel quel, driver psycopg2 déjà installé)
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Supabase Storage (Project Settings → API) pour les pièces jointes, le
      # disque de ce service étant éphémère en plan gratuit
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      # Signature des sessions JWT — générée automatiquement par Render, jamais à
      # renseigner à la main.
      - key: SECRET_KEY
        generateValue: true
      # WebAuthn (Face ID/Touch ID) : doit correspondre exactement au domaine Vercel
      # du frontend déployé.
      - key: WEBAUTHN_RP_ID
        value: taches-notes-veille.vercel.app
      - key: WEBAUTHN_RP_NAME
        value: FluxCap
      - key: WEBAUTHN_ORIGIN
        value: https://taches-notes-veille.vercel.app
      # Secret partagé avec le workflow GitHub Actions planifié (voir
      # .github/workflows/planification.yml) — généré automatiquement, à recopier
      # tel quel dans le secret de repo GitHub SCHEDULER_SECRET.
      - key: SCHEDULER_SECRET
        generateValue: true
      # Notifications email (Resend) — clé API sur resend.com, adresse d'envoi par
      # défaut du sandbox Resend (fonctionne sans domaine vérifié, tant que
      # NOTIFICATION_EMAIL est l'adresse de ton propre compte Resend).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: onboarding@resend.dev
      - key: NOTIFICATION_EMAIL
        sync: false
